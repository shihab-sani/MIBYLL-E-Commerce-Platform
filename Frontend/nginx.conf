server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Hide nginx version ---
    server_tokens off;

    # --- OWASP secure headers ---
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;

    # --- Content Security Policy ---
    # 'connect-src' only needs 'self' because /api is proxied to the backend
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: https:;
        media-src 'self' https:;
        connect-src 'self';
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
        upgrade-insecure-requests;
    " always;

    # --- Upload size limit (matches backend) ---
    client_max_body_size 100M;
    client_body_timeout  30s;
    client_header_timeout 30s;
    keepalive_timeout 65;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml image/svg+xml;

    # --- Healthcheck endpoint ---
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- API proxy to backend ---
    location /api/ {
        proxy_pass         http://online-shop:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $http_host;     # ← NEW — includes port
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_read_timeout 120s;
    }

    # --- Uploads proxy ---
    location /uploads/ {
        proxy_pass         http://online-shop:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Cache static assets aggressively ---
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- HTML: never cache (so users always get the latest bundle reference) ---
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}